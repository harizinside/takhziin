{% extends "base.html" %}
{% block content %}
<section class="card">
  <div class="card-header"><h2>Notifications</h2></div>
  {% if cfg %}
  <table class="kv">
    <tr><td><strong>kind</strong></td><td>{{ cfg.kind }}</td></tr>
    <tr><td><strong>bot_token</strong></td><td><code>{{ masked }}</code></td></tr>
    <tr><td><strong>chat_id</strong></td><td><code>{{ cfg.chat_id }}</code></td></tr>
    <tr><td><strong>events</strong></td><td>{{ cfg.events | join(", ") }}</td></tr>
  </table>
  {% endif %}

  <form action="/notifications/save" method="post" class="form">
    <h3>Configure Telegram bot</h3>
    <label>Bot token <input name="bot_token" type="password" required></label>
    <label>Chat ID <input name="chat_id" placeholder="-1001234567890" required></label>
    <label>Proxy URL (http:// or socks5://) <input name="proxy_url"></label>
    <label class="checkbox"><input type="checkbox" name="on_success" {% if not cfg or "success" in cfg.events %}checked{% endif %}> On success</label>
    <label class="checkbox"><input type="checkbox" name="on_failure" {% if not cfg or "failure" in cfg.events %}checked{% endif %}> On failure</label>
    <button class="btn" type="submit">Save</button>
  </form>

  <div class="row" style="gap:8px;margin-top:12px">
    <form action="/notifications/test" method="post" style="display:inline">
      <button class="btn btn-ghost" type="submit">Send test</button>
    </form>
    {% if cfg %}
    <form action="/notifications/clear" method="post" style="display:inline"
          onsubmit="return confirm('Clear notifier config?')">
      <button class="btn btn-danger" type="submit">Clear</button>
    </form>
    {% endif %}
  </div>
</section>
{% endblock %}
