services:
  takhziin:
    image: ghcr.io/harizinside/takhziin:latest
    container_name: takhziin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - takhziin-data:/data
    environment:
      - TAKHZIIN_BIND_HOST=0.0.0.0
      - TAKHZIIN_BIND_PORT=8765
      - TZ=UTC
    healthcheck:
      test: ["CMD", "python", "-m", "takhziin.cli", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  takhziin-data: